name: Build ZGT iOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare branding assets
        run: |
          RESOURCE_DIR="ZGT/Resources"
          SOURCE_ICON="/tmp/zgt-source-icon.png"
          mkdir -p "$RESOURCE_DIR"
          base64 -d -i ZGT/Branding/app-icon.png.b64 -o "$SOURCE_ICON"

          # Bundle the exact user-supplied icon as classic iOS icon resources.
          # PNG compression is disabled in project.yml so sideloaded builds
          # keep standard PNG bytes instead of CgBI-optimized files.
          sips -z 60 60 "$SOURCE_ICON" --out "$RESOURCE_DIR/ZGTIcon.png" >/dev/null
          sips -z 120 120 "$SOURCE_ICON" --out "$RESOURCE_DIR/ZGTIcon@2x.png" >/dev/null
          sips -z 180 180 "$SOURCE_ICON" --out "$RESOURCE_DIR/ZGTIcon@3x.png" >/dev/null

          # Keep untouched standard-PNG copies for the final sideload package.
          cp "$RESOURCE_DIR/ZGTIcon.png" /tmp/ZGTIcon.png
          cp "$RESOURCE_DIR/ZGTIcon@2x.png" /tmp/ZGTIcon@2x.png
          cp "$RESOURCE_DIR/ZGTIcon@3x.png" /tmp/ZGTIcon@3x.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_DIR="build-device/Build/Products/Release-iphoneos/ZGT.app"

          # Xcode optimizes PNG resources to CgBI. Replace only the app-icon
          # files after the build so Sideloadly receives ordinary PNGs.
          cp /tmp/ZGTIcon.png "$APP_DIR/ZGTIcon.png"
          cp /tmp/ZGTIcon@2x.png "$APP_DIR/ZGTIcon@2x.png"
          cp /tmp/ZGTIcon@3x.png "$APP_DIR/ZGTIcon@3x.png"
          rm -f "$APP_DIR/app-icon.png.b64"

          rm -rf Payload ZGT-iOS-v0.1.2-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qry ZGT-iOS-v0.1.2-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZGT-iOS-v0.1.2-unsigned
          path: ZGT-iOS-v0.1.2-unsigned.ipa
          if-no-files-found: error
