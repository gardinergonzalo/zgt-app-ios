name: Build ZGT iOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare branding assets
        run: |
          ICON_DIR="ZGT/Assets.xcassets/AppIcon.appiconset"
          RESOURCE_DIR="ZGT/Resources"
          mkdir -p "$RESOURCE_DIR"
          base64 -d -i ZGT/Branding/app-icon.png.b64 -o "$ICON_DIR/source.png"

          # Asset catalog copies for Xcode previews.
          sips -z 40 40 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-20@2x.png" >/dev/null
          sips -z 60 60 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-20@3x.png" >/dev/null
          sips -z 58 58 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-29@2x.png" >/dev/null
          sips -z 87 87 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-29@3x.png" >/dev/null
          sips -z 80 80 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-40@2x.png" >/dev/null
          sips -z 120 120 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-40@3x.png" >/dev/null
          sips -z 120 120 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-60@2x.png" >/dev/null
          sips -z 180 180 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-60@3x.png" >/dev/null
          sips -z 1024 1024 "$ICON_DIR/source.png" --out "$ICON_DIR/Icon-1024.png" >/dev/null

          # Classic icon resources are also bundled explicitly. This avoids
          # sideload/icon-cache issues with asset-catalog-only icons.
          sips -z 60 60 "$ICON_DIR/source.png" --out "$RESOURCE_DIR/ZGTIcon.png" >/dev/null
          sips -z 120 120 "$ICON_DIR/source.png" --out "$RESOURCE_DIR/ZGTIcon@2x.png" >/dev/null
          sips -z 180 180 "$ICON_DIR/source.png" --out "$RESOURCE_DIR/ZGTIcon@3x.png" >/dev/null

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload ZGT-iOS-v0.1.2-unsigned.ipa
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/ZGT.app Payload/
          zip -qry ZGT-iOS-v0.1.2-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZGT-iOS-v0.1.2-unsigned
          path: ZGT-iOS-v0.1.2-unsigned.ipa
          if-no-files-found: error
