name: Build ZGT iOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare branding assets
        run: |
          RESOURCE_DIR="ZGT/Resources"
          ICON_DIR="ZGT/Assets.xcassets/AppIcon.appiconset"
          SOURCE_ICON="/tmp/zgt-source-icon.png"
          mkdir -p "$RESOURCE_DIR" "$ICON_DIR"
          base64 -d -i ZGT/Branding/app-icon.png.b64 -o "$SOURCE_ICON"

          # Full iPhone AppIcon catalog generated from the exact user-supplied PNG.
          sips -z 40 40 "$SOURCE_ICON" --out "$ICON_DIR/Icon-20@2x.png" >/dev/null
          sips -z 60 60 "$SOURCE_ICON" --out "$ICON_DIR/Icon-20@3x.png" >/dev/null
          sips -z 58 58 "$SOURCE_ICON" --out "$ICON_DIR/Icon-29@2x.png" >/dev/null
          sips -z 87 87 "$SOURCE_ICON" --out "$ICON_DIR/Icon-29@3x.png" >/dev/null
          sips -z 80 80 "$SOURCE_ICON" --out "$ICON_DIR/Icon-40@2x.png" >/dev/null
          sips -z 120 120 "$SOURCE_ICON" --out "$ICON_DIR/Icon-40@3x.png" >/dev/null
          sips -z 120 120 "$SOURCE_ICON" --out "$ICON_DIR/Icon-60@2x.png" >/dev/null
          sips -z 180 180 "$SOURCE_ICON" --out "$ICON_DIR/Icon-60@3x.png" >/dev/null
          sips -z 1024 1024 "$SOURCE_ICON" --out "$ICON_DIR/Icon-1024.png" >/dev/null

          # Classic icon resources remain as a sideload fallback.
          sips -z 60 60 "$SOURCE_ICON" --out "$RESOURCE_DIR/ZGTIcon.png" >/dev/null
          sips -z 120 120 "$SOURCE_ICON" --out "$RESOURCE_DIR/ZGTIcon@2x.png" >/dev/null
          sips -z 180 180 "$SOURCE_ICON" --out "$RESOURCE_DIR/ZGTIcon@3x.png" >/dev/null

          cp "$RESOURCE_DIR/ZGTIcon.png" /tmp/ZGTIcon.png
          cp "$RESOURCE_DIR/ZGTIcon@2x.png" /tmp/ZGTIcon@2x.png
          cp "$RESOURCE_DIR/ZGTIcon@3x.png" /tmp/ZGTIcon@3x.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_DIR="build-device/Build/Products/Release-iphoneos/ZGT.app"

          # Xcode optimizes PNG resources to CgBI. Replace only the app-icon
          # files after the build so Sideloadly receives ordinary PNGs.
          cp /tmp/ZGTIcon.png "$APP_DIR/ZGTIcon.png"
          cp /tmp/ZGTIcon@2x.png "$APP_DIR/ZGTIcon@2x.png"
          cp /tmp/ZGTIcon@3x.png "$APP_DIR/ZGTIcon@3x.png"
          rm -f "$APP_DIR/app-icon.png.b64"

          rm -rf Payload ZGT-iOS-v0.1.3-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qry ZGT-iOS-v0.1.3-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZGT-iOS-v0.1.3-unsigned
          path: ZGT-iOS-v0.1.3-unsigned.ipa
          if-no-files-found: error
