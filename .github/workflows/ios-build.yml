name: Build ZGT iOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Bluetooth response parser
        run: |
          swiftc ZGT/NiimbotPacketDecoder.swift Tests/DecoderRegressionTests.swift -o /tmp/zgt-decoder-tests
          /tmp/zgt-decoder-tests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload ZGT-iOS-v0.1.7-unsigned.ipa
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/ZGT.app Payload/
          zip -qry ZGT-iOS-v0.1.7-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZGT-iOS-v0.1.7-unsigned
          path: ZGT-iOS-v0.1.7-unsigned.ipa
          if-no-files-found: error
