name: Build ZGT iOS

on:
  push:
    branches: [ fix/ios-0.1.16-from-stable-0.1.9, fix/ios-v0.1.20-stable-makeUIView, fix/ios-android-boot-cover-v0.1.20, fix/ios-internal-navigation-cover-v0.1.20, fix/ios-navigation-brand-ring-v0.1.20 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ZGTiOS.xcodeproj \
            -scheme ZGT \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload ZGT-iOS-v0.1.20-unsigned.ipa
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/ZGT.app Payload/
          zip -qry ZGT-iOS-v0.1.20-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZGT-iOS-v0.1.20-unsigned
          path: ZGT-iOS-v0.1.20-unsigned.ipa
          if-no-files-found: error
