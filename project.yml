name: ZGTiOS
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.zeoz
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.3
    CURRENT_PROJECT_VERSION: 4
targets:
  ZGT:
    type: application
    platform: iOS
    sources:
      - path: ZGT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeoz.zgt
        PRODUCT_NAME: ZGT
        INFOPLIST_FILE: ZGT/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMPRESS_PNG_FILES: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
